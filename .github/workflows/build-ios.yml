name: Build Jamio iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Capacitor iOS
        run: |
          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/ios@5.7.4
          cp node_modules/@capacitor/core/dist/capacitor.js preview/capacitor.js || true
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Jamio" "com.jamio.music" --web-dir "preview"
          fi
          npx cap add ios || true

          # Setup Jamio Official iOS App Icons
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          sips -s format png -z 1024 1024 preview/app_logo.png --out "$ICON_DIR/AppIcon-1024.png"
          sips -z 40 40 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-20@2x.png"
          sips -z 60 60 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-20@3x.png"
          sips -z 58 58 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-29@2x.png"
          sips -z 87 87 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-29@3x.png"
          sips -z 80 80 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-40@2x.png"
          sips -z 120 120 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-40@3x.png"
          sips -z 120 120 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-60@2x.png"
          sips -z 180 180 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-60@3x.png"
          sips -z 152 152 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-76@2x.png"
          sips -z 167 167 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-83.5@2x.png"
          sips -z 1024 1024 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-512@2x.png"

          python3 -c "import json; open('$ICON_DIR/Contents.json', 'w').write(json.dumps({'images': [{'idiom':'universal','platform':'ios','size':'1024x1024','filename':'AppIcon-1024.png'},{'idiom':'iphone','size':'20x20','scale':'2x','filename':'AppIcon-20@2x.png'},{'idiom':'iphone','size':'20x20','scale':'3x','filename':'AppIcon-20@3x.png'},{'idiom':'iphone','size':'29x29','scale':'2x','filename':'AppIcon-29@2x.png'},{'idiom':'iphone','size':'29x29','scale':'3x','filename':'AppIcon-29@3x.png'},{'idiom':'iphone','size':'40x40','scale':'2x','filename':'AppIcon-40@2x.png'},{'idiom':'iphone','size':'40x40','scale':'3x','filename':'AppIcon-40@3x.png'},{'idiom':'iphone','size':'60x60','scale':'2x','filename':'AppIcon-60@2x.png'},{'idiom':'iphone','size':'60x60','scale':'3x','filename':'AppIcon-60@3x.png'},{'idiom':'ipad','size':'76x76','scale':'2x','filename':'AppIcon-76@2x.png'},{'idiom':'ipad','size':'83.5x83.5','scale':'2x','filename':'AppIcon-83.5@2x.png'}],'info':{'author':'xcode','version':1}}, indent=2))"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" ios/App/App/Info.plist || true
          cd ios/App
          pod install
          cd ../..
          npx cap sync ios

      - name: Build Archive with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p build_output/Payload
          cp -r ios/App/App.xcarchive/Products/Applications/App.app build_output/Payload/Jamio.app
          cd build_output
          zip -r Jamio.ipa Payload
          echo "IPA Size:"
          ls -lh Jamio.ipa

      - name: Upload Jamio IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jamio-Universal-iOS-IPA
          path: build_output/Jamio.ipa
          retention-days: 30
